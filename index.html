<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <link rel="stylesheet" href="index.css">
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=shield,electric_bolt,code,travel" />"
    <title>Document</title>
</head>
<body>
    <header class="HeaderOfSite">
        <figure class="figure_logo">
    <span class="material-symbols-outlined logo">
shield
</span>
</figure>
<h1 class="H1_sigint">SIGINT OPS</h1>
<aside class="secure-badge" role="status" aria-label="System Security Status">
        <span class="status-dot" aria-hidden="true"></span>
        <span>SECURE • ONLINE</span>
    </aside>
    </header>
    <main class="main_page">
<section class="rader_section">
    <div class="radar-container">
<div class='radar'>
  <div class='sweep'></div>
</div>
</div>
<div class="stats_container">
    <div class="stat_box">
        <span class="stat_number">24</span>
        <span class="stat_label">ACTIVE SIGNALS</span>
    </div>
       <div class="stat_box">
        <span class="stat_number">07</span>
        <span class="stat_label">PRIORITY ALERTS</span>
    </div>
    </div>
</section>
<div class="action_bottom">
    <button class="button_">
       <span class="material-symbols-outlined">
electric_bolt
</span>
<p>New Brief</p>
    </button>
    <button class="button_">
        <span class="material-symbols-outlined">
code
</span>
<p>Decode</p>
    </button>
     <button class="button_">
        <span class="material-symbols-outlined">
travel
</span>
        <p>Request Drone</p>
    </button>
</div>
<section class="intel-cards-grid" aria-label="כרטיסי משימות ומודיעין">
    <article class="intel-card critical">
        <header class="card-header">
            <span class="status-badge critical-badge">CRITICAL</span>
            <span class="card-state">In Progress</span>
        </header>
        <h3 class="card-title">Operation Nightfall</h3>
        <div class="progress-container">
            <div class="card-progress-bar" role="progressbar" aria-valuenow="65" aria-valuemin="0" aria-valuemax="100">
                <div class="progress-fill critical-fill" style="width: 65%;"></div>
            </div>
            <span class="progress-value">65%</span>
        </div>
    </article>
    <article class="intel-card high">
        <header class="card-header">
            <span class="status-badge high-badge">HIGH</span>
            <span class="card-state">Analyzing</span>
        </header>
        <h3 class="card-title">Signal Intercept Alpha</h3>
        <div class="progress-container">
            <div class="card-progress-bar" role="progressbar" aria-valuenow="48" aria-valuemin="0" aria-valuemax="100">
                <div class="progress-fill high-fill" style="width: 48%;"></div>
            </div>
            <span class="progress-value">48%</span>
        </div>
    </article>
    <article class="intel-card medium">
        <header class="card-header">
            <span class="status-badge medium-badge">MEDIUM</span>
            <span class="card-state">Pending</span>
        </header>
        <h3 class="card-title">Asset Recovery</h3>
        <div class="progress-container">
            <div class="card-progress-bar" role="progressbar" aria-valuenow="15" aria-valuemin="0" aria-valuemax="100">
                <div class="progress-fill medium-fill" style="width: 15%;"></div>
            </div>
            <span class="progress-value">15%</span>
        </div>
    </article>
    <article class="intel-card high">
        <header class="card-header">
            <span class="status-badge high-badge">HIGH</span>
            <span class="card-state">Active</span>
        </header>
        <h3 class="card-title">Cyber Defense Grid</h3>
        <div class="progress-container">
            <div class="card-progress-bar" role="progressbar" aria-valuenow="80" aria-valuemin="0" aria-valuemax="100">
                <div class="progress-fill high-fill" style="width: 80%;"></div>
            </div>
            <span class="progress-value">80%</span>
        </div>
    </article>
</section>
<div class="threat-alert-banner" role="alert" aria-label="התראת איום מערכת">
    <span class="threat-dot" aria-hidden="true"></span>
    <span class="threat-text">THREAT DETECTED</span>
</div>
    </main>
    <nav class="bottom_nav">
   <ul>
    <li></li>
    <li></li>
    <li></li>
   </ul>
    </nav>
</body>
</html>
